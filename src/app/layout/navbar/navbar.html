<nav class="fixed top-0 left-0 w-full z-50
            bg-white/80 backdrop-blur-md
            border-b border-gray-200">

  <div class="relative flex items-center justify-between px-6 py-4">

    <a href="#" class="inline-block">
      <img src="images/logo.png"
           alt="Logo"
           class="w-24 md:w-36 transition-transform duration-200 hover:scale-105">
    </a>

    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 gap-10 font-medium">

      <a
        href="#home"
        class="relative pb-1 transition-colors duration-300"
        [class.text-black]="scrollService.activeSection() === 'home'"
        [class.text-gray-600]="scrollService.activeSection() !== 'home'"
        [class.hover:text-emerald-600]="scrollService.activeSection() !== 'home'">

        Home

        <span
          class="absolute left-0 -bottom-1 h-0.5 w-full bg-emerald-500
             origin-left transform scale-x-0
             transition-transform duration-300"
          [class.scale-x-100]="scrollService.activeSection() === 'home'">
    </span>
      </a>

      <a
        href="#about"
        class="relative pb-1 transition-colors duration-300"
        [class.text-black]="scrollService.activeSection() === 'about'"
        [class.text-gray-600]="scrollService.activeSection() !== 'about'"
        [class.hover:text-emerald-600]="scrollService.activeSection() !== 'about'">

        Sobre

        <span
          class="absolute left-0 -bottom-1 h-0.5 w-full bg-emerald-500
             origin-left transform scale-x-0
             transition-transform duration-300"
          [class.scale-x-100]="scrollService.activeSection() === 'about'">
    </span>
      </a>

      <a
        href="#projects"
        class="relative pb-1 transition-colors duration-300"
        [class.text-black]="scrollService.activeSection() === 'projects'"
        [class.text-gray-600]="scrollService.activeSection() !== 'projects'"
        [class.hover:text-emerald-600]="scrollService.activeSection() !== 'projects'">

        Projetos

        <span
          class="absolute left-0 -bottom-1 h-0.5 w-full bg-emerald-500
             origin-left transform scale-x-0
             transition-transform duration-300"
          [class.scale-x-100]="scrollService.activeSection() === 'projects'">
    </span>
      </a>

      <a
        href="#skills"
        class="relative pb-1 transition-colors duration-300"
        [class.text-black]="scrollService.activeSection() === 'skills'"
        [class.text-gray-600]="scrollService.activeSection() !== 'skills'"
        [class.hover:text-emerald-600]="scrollService.activeSection() !== 'skills'">

        Skills

        <span
          class="absolute left-0 -bottom-1 h-0.5 w-full bg-emerald-500
             origin-left transform scale-x-0
             transition-transform duration-300"
          [class.scale-x-100]="scrollService.activeSection() === 'skills'">
    </span>
      </a>

      <a
        href="#contact"
        class="relative pb-1 transition-colors duration-300"
        [class.text-black]="scrollService.activeSection() === 'contact'"
        [class.text-gray-600]="scrollService.activeSection() !== 'contact'"
        [class.hover:text-emerald-600]="scrollService.activeSection() !== 'contact'">

        Contato

        <span
          class="absolute left-0 -bottom-1 h-0.5 w-full bg-emerald-500
             origin-left transform scale-x-0
             transition-transform duration-300"
          [class.scale-x-100]="scrollService.activeSection() === 'contact'">
        </span>
      </a>

    </div>

    @if (menuOpen) {
      <div class="md:hidden fixed top-16 left-0 w-full bg-white shadow-lg py-8 z-40">

        <div class="flex flex-col items-center gap-6 font-medium text-lg">

          <a href="#home" (click)="toggleMenu()">Home</a>
          <a href="#about" (click)="toggleMenu()">Sobre</a>
          <a href="#projects" (click)="toggleMenu()">Projetos</a>
          <a href="#skills" (click)="toggleMenu()">Skills</a>
          <a href="#contact" (click)="toggleMenu()">Contato</a>

        </div>

      </div>
    }

    <button
      class="md:hidden w-10 h-10 flex items-center justify-center"
      (click)="toggleMenu()">
      ☰
    </button>

    <button
      class="w-10 h-10 flex items-center justify-center
           rounded-full bg-gray-100
           hover:bg-gray-200 transition cursor-pointer">
      🌙
    </button>
  </div>
</nav>
