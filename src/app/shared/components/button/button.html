<button
  class="px-6 py-3 rounded-lg font-medium transition-all duration-200 cursor-pointer"
  [ngClass]="{
    'bg-emerald-600 text-white hover:bg-emerald-700 shadow-md hover:scale-105': variant === 'primary',
    'border border-emerald-600 text-emerald-600 hover:bg-emerald-50': variant === 'secondary'
  }"
>
  {{text}}
</button>
