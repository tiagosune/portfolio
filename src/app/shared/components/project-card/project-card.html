<div
  appReveal="right"
  class="group border border-gray-200 rounded-2xl overflow-hidden bg-white
         transition-all duration-300 hover:-translate-y-1 hover:shadow-xl h-full flex flex-col"
>

  <div class="overflow-hidden h-56">
    <img
      [src]="project.image"
      [alt]="project.title"
      class="w-full h-full object-cover transition duration-500 group-hover:scale-105"
      loading="lazy"
    >
  </div>

  <div class="p-6 flex flex-col justify-between h-full grow">

    <h3 class="text-xl font-semibold text-black">
      {{ project.title }}
    </h3>

    <p class="mt-4 text-gray-600 leading-relaxed">
      {{ project.description }}
    </p>

    <div class="mt-6 flex flex-wrap gap-2">
      @for (tech of project.tech; track tech) {
        <span class="text-xs px-3 py-1 bg-gray-100 text-gray-600 rounded-md hover:bg-gray-200 cursor-default">
          {{ tech }}
        </span>
      }

    </div>

    <div class="mt-auto flex gap-8 text-sm font-medium">

      @if (project.demo) {
        <a
          [href]="project.demo"
          target="_blank"
          class="hover:text-emerald-600 transition-colors"
        >
          Ver projeto
        </a>
      }

      @if (project.github) {
        <a
          [href]="project.github"
          target="_blank"
          class="hover:text-emerald-600 transition-colors"
        >
          GitHub
        </a>
      }

    </div>

  </div>

</div>
