<section
  id="home"
  class="relative min-h-screen flex items-center pt-28
         bg-linear-to-b from-white via-gray-100 to-white
         text-zinc-800"
>

  <div class="container-layout grid grid-cols-1 md:grid-cols-2 gap-16 items-center">

    <div>

      <span class="text-sm tracking-widest text-gray-500 uppercase">
        Full Stack Developer
      </span>

      <h1 class="mt-4 text-4xl md:text-6xl font-bold leading-tight tracking-tight text-black">
        <span class="md:whitespace-nowrap">
          Tiago Suñé Duarte
        </span>
      </h1>

      <div class="w-16 h-[2px] bg-emerald-500 mt-6"></div>

      <p class="mt-8 text-lg md:text-xl text-gray-600 max-w-xl leading-relaxed">
        Desenvolvedor focado em
        <span class="text-emerald-600 font-medium">Java</span>,
        <span class="text-emerald-600 font-medium">Spring Boot</span> e
        <span class="text-emerald-600 font-medium">Angular</span>,
        criando aplicações escaláveis, performáticas e bem estruturadas.
      </p>

      <div class="mt-10 flex gap-6">
        <app-button
          text="Ver Projetos"
          variant="primary"
          (click)="scrollTo('projects')">
        </app-button>

        <app-button
          text="Fale Comigo"
          variant="secondary">
        </app-button>
      </div>

    </div>

    <div class="flex justify-center md:justify-end">
      <img
        src="images/logo-tech.png"
        alt="Tecnologias utilizadas"
        class="w-full max-w-150"
      >
    </div>

  </div>

</section>
