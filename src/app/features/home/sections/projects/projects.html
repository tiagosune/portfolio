<section id="projects" class="py-28 bg-gray-50">
  <div class="container-layout">

    <div appReveal="left" class="mb-16 max-w-2xl">
      <span class="text-xs tracking-[0.2em] text-gray-500 uppercase">
        Portfólio
      </span>

      <h2 class="mt-4 text-4xl md:text-5xl font-medium tracking-tight">
        Projetos
      </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-10 items-stretch">
      @for (project of projects; track project.title) {
        <app-project-card [project]="project"></app-project-card>
      }
    </div>

  </div>
</section>
