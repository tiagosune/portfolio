<section id="contact" class="py-32 bg-gray-50 relative">

  <div appReveal="up" class="container-layout text-center">

    <span class="text-sm tracking-widest text-gray-500 uppercase">
      Contato
    </span>

    <h2 class="mt-4 text-4xl md:text-5xl font-semibold">
      Vamos conversar
    </h2>

    <p class="mt-6 text-gray-600 max-w-xl mx-auto leading-relaxed">
      Se você gostou do meu trabalho ou quer trocar uma ideia sobre tecnologia,
      projetos ou oportunidades, fico feliz em conversar.
    </p>

    <div class="mt-12 flex flex-col sm:flex-row sm:flex-wrap justify-center gap-6 w-full max-w-xl mx-auto">

      <a href="https://github.com/tiagosune"
         target="_blank"
         class="flex items-center gap-3 px-8 py-4 rounded-full
                border border-gray-300 bg-white text-gray-700
                text-base font-medium
                transition-all duration-300
                hover:bg-black hover:text-white hover:border-black hover:scale-105">

        GitHub
      </a>

      <a href="https://linkedin.com/in/tiagosunedev"
         target="_blank"
         class="flex items-center gap-3 px-8 py-4 rounded-full
                border border-gray-300 bg-white text-gray-700
                text-base font-medium
                transition-all duration-300
                hover:bg-blue-700 hover:text-white hover:border-b-blue-700 hover:scale-105">

        LinkedIn
      </a>

      <button
        (click)="copyEmail()"
        class="flex items-center gap-3 px-8 py-4 w-full sm:w-auto rounded-full
         border border-gray-300 bg-white text-gray-700
         text-base font-medium
         transition-all duration-300
         hover:bg-red-600 hover:text-white hover:border-b-red-600 hover:scale-105 cursor-pointer">

        Email
      </button>

    </div>

  </div>

</section>

@if (copied()) {
  <div
    class="fixed bottom-6 right-6 z-50
           bg-emerald-600 text-white
           px-6 py-4 rounded-2xl shadow-2xl
           flex items-center gap-3
           text-sm font-medium
           animate-toast-in">

    <span class="text-lg">✓</span>
    Email copiado para a área de transferência

  </div>
}
